<!DOCTYPE html>
<html lang="en">

<head></head>

<body>
    <!-- Navbar -->
    <!-- Main Section -->
    <!-- Logo & Promo -->
    <!-- Video Section -->
    <!-- Checkout Section -->
     <section class="checkout">
      <div class="checkout-header">
        <h2>Checkout</h2>
      </div>

      <form class="checkout-form">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Your email address" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Your phone number" required>
        </div>

        <div class="form-group">
          <label for="address">Delivery Address</label>
          <textarea id="address" name="address" rows="3" placeholder="Your delivery address" required></textarea>
        </div>

        <div class="form-group">
          <label for="payment">Payment Method</label>
          <select id="payment" name="payment" required>
            <option value="">Select payment method</option>
            <option value="cod">Cash on Delivery</option>
            <option value="credit">Credit / Debit Card</option>
            <option value="gcash">GCash</option>
          </select>
        </div>
    </section>

    <div class="checkout-items">
      <div class="item-card">
        <img src="imgs/checkout_1.png" alt="Checkout 1">
        <div class="details">
          <h4>One Piece Cosplay - Monkey D. Luffy Straw Hat</h4>
          <p class="price">$17.99</p>
          <div class="item-number">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
        </div>
      </div>

      <div class="item-card">
        <img src="imgs/checkout_2.png" alt="Checkout 2">
        <div class="details">
          <h4>Funko Pop Monkey D. Luffy 1459 Wanted Poster NYCC Exclusive Sticker One Piece</h4>
          <p class="price">$249.95</p>
          <div class="item-number">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="checkout-summary">
      <p class="total-label">In total</p>
      <p class="total-amount">$267.94</p>
    </div>

    <div class="checkout-button">
      <button class="place-order">Place order</button>
    </div>
    </section>
    <!-- Footer -->
</body>

</html>
